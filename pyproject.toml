[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hat-tool"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "west>=1.0.0",
    "questionary>=2.0.0",
    "rich>=13.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["hat_tool"]
[project.scripts]
hat = "hat_tool.cli:main"
